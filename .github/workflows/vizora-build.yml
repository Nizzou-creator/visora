                          ) {
                              Text(
                                  "Create New Project",
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(20.dp))

                  Row(
                      Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      FeatureCard("Templates", Modifier.weight(1f))
                      FeatureCard("Effects", Modifier.weight(1f))
                  }

                  Spacer(Modifier.height(12.dp))

                  Row(
                      Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      FeatureCard("Music", Modifier.weight(1f))
                      FeatureCard("Captions", Modifier.weight(1f))
                  }
              }
          }


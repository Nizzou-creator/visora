name: VIZORA Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'VIZORA-1.0.0-starter.zip'
      - '.github/workflows/vizora-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf build_src
          mkdir build_src
          unzip -q VIZORA-1.0.0-starter.zip -d build_src
          test -f build_src/vizora/settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: build_src/vizora
        run: |
          gradle --version
          gradle clean assembleDebug --stacktrace

      - name: Check APK
        run: |
          find build_src/vizora/app/build/outputs -name "*.apk" -print
          test -n "$(find build_src/vizora/app/build/outputs -name '*.apk')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIZORA-debug
          path: build_src/vizora/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

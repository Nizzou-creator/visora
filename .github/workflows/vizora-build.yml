name: VIZORA Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'VIZORA-1.0.0-starter.zip'
      - '.github/workflows/vizora-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract VIZORA project
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -q VIZORA-1.0.0-starter.zip -d build_src
          test -f build_src/vizora/settings.gradle.kts
          echo "VIZORA project found"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Replace MainActivity
        working-directory: build_src/vizora
        shell: bash
        run: |
          cat > app/src/main/java/com/vizora/app/MainActivity.kt <<'EOF'
          package com.vizora.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
